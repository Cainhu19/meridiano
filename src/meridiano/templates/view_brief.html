<!doctype html>
<html lang="en">
{% set title = "Briefing - " ~ generation_time %}
{% include 'head.html' %}
<body>
    <div class="container">
        {% include 'header.html' %}

        <p class="eyebrow"><i class="fas fa-file-alt"></i> Daily briefing</p>
        <h1>Intelligence Brief</h1>
        <p class="timestamp">Generated: {{ generation_time }} (ID: {{ brief_id }})</p>
        <hr>
        <div class="brief-content reading-content">
            {{ brief_content|safe }}
        </div>
    </div>
</body>
</html>
